<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidMind | Supply Chain Intelligence & Recovery Platform</title>
    <meta name="description" content="Enterprise supply-chain intelligence and disruption recovery platform with deterministic risk engine and multi-role workflows." />
    <meta property="og:title" content="VoidMind | Supply Chain Intelligence & Recovery Platform" />
    <meta property="og:description" content="Enterprise supply-chain intelligence and disruption recovery platform with deterministic risk engine and multi-role workflows." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('voidmind-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-primary)] antialiased selection:bg-[#FF5938] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
